        // Audio Synthesizer (Web Audio API) for instant sound feedback
        const playSound = (type) => {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                if (type === 'correct') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, ctx.currentTime); // C5
                    osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.1); // E5
                    osc.frequency.setValueAtTime(783.99, ctx.currentTime + 0.2); // G5
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.4);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.4);
                } else if (type === 'wrong') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(300, ctx.currentTime);
                    osc.frequency.setValueAtTime(200, ctx.currentTime + 0.15);
                    gain.gain.setValueAtTime(0.15, ctx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.35);
                    osc.start();
                    osc.stop(ctx.currentTime + 0.35);
                } else if (type === 'complete') {
                    confetti({
                        particleCount: 80,
                        spread: 70,
                        origin: { y: 0.6 }
                    });
                }
            } catch(e) {
                // Audio Context fallback if blocked by browser policy
            }
        };

            React.useEffect(() => {
                let timer = null;
                if (isExamActive && timeLeft > 0 && !examSubmitted) {

                                                value={catalogDomainFilter}
                                                onChange={(e) => setCatalogDomainFilter(e.target.value)}
                                                className="px-3 py-2 text-xs rounded-xl border border-slate-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white font-medium"
                                            >
                                                <option value="all">Semua Bidang Kompetensi</option>
                                                <option value="supervisi_akademik">Supervisi Akademik</option>
                                                <option value="supervisi_manajerial">Supervisi Manajerial</option>
                                                <option value="evaluasi_pendidikan">Evaluasi Pendidikan</option>
                                                <option value="penelitian_pengembangan">Penelitian & Pengembangan</option>
                                            </select>
                                        </div>
                                    </div>

                                    {/* Questions Catalog List */}
                                    <div className="space-y-4">
                                        {Object.values(QUESTION_BANK)
                                            .filter(domain => catalogDomainFilter === 'all' || domain.id === catalogDomainFilter)
                                            .map(domain => {
                                                const filteredQ = domain.questions.filter(q => 
                                                    q.question.toLowerCase().includes(searchQuery.toLowerCase()) ||
                                                    q.explanation.toLowerCase().includes(searchQuery.toLowerCase())
                                                );

                                                if (filteredQ.length === 0) return null;

                                                return (
                                                    <div key={domain.id} className="space-y-3">
                                                        <div className="bg-emerald-800 text-white px-4 py-2 rounded-xl text-xs font-bold uppercase tracking-wider flex items-center justify-between">
                                                            <span>{domain.title}</span>
                                                            <span className="bg-emerald-700 px-2 py-0.5 rounded text-[10px]">{filteredQ.length} Soal</span>
                                                        </div>

                                                        <div className="space-y-3">
                                                            {filteredQ.map((q, idx) => (
                                                                <div key={q.id} className="p-5 rounded-2xl border border-slate-200 bg-slate-50 hover:bg-white transition space-y-3">
                                                                    <div className="flex items-start justify-between gap-2">
                                                                        <h5 className="font-semibold text-slate-800 text-sm sm:text-base leading-snug">
                                                                            <span className="text-emerald-700 font-bold mr-2">#{idx + 1}.</span>
                                                                            {q.question}
                                                                        </h5>
                                                                        <button 
                                                                            onClick={() => toggleBookmark(q.id)}
                                                                            className={`text-sm ${bookmarks.includes(q.id) ? 'text-amber-500' : 'text-slate-300 hover:text-slate-400'}`}
                                                                        >
                                                                            <i className="fa-solid fa-bookmark"></i>
                                                                        </button>
                                                                    </div>

                                                                    <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 text-xs">
                                                                        {q.options.map((opt, optIdx) => (
                                                                            <div key={optIdx} className={`p-2.5 rounded-lg border ${optIdx === q.key ? 'bg-emerald-100/80 border-emerald-300 text-emerald-950 font-semibold' : 'bg-white border-slate-200 text-slate-600'}`}>
                                                                                <span className="font-bold mr-1.5">{String.fromCharCode(65 + optIdx)}.</span>
                                                                                {opt}
                                                                            </div>
                                                                        ))}
                                                                    </div>

                                                                    <div className="bg-emerald-50 border border-emerald-200 p-3.5 rounded-xl text-xs space-y-1">
                                                                        <div className="font-bold text-emerald-800 flex items-center gap-1.5">
                                                                            <i className="fa-solid fa-check-circle"></i>
                                                                            <span>Kunci Jawaban: Opsi {String.fromCharCode(65 + q.key)}</span>
                                                                        </div>
                                                                        <p className="text-slate-700 leading-relaxed pt-1">
                                                                            <span className="font-semibold">Reasoning:</span> {q.explanation}
                                                                        </p>
                                                                    </div>
                                                                </div>
                                                            ))}
                                                        </div>
                                                    </div>
                                                );
                                            })}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>

                    {/* FOOTER SECTION */}
                    {}
                    <footer className="bg-emerald-950 text-emerald-200 border-t border-emerald-800 py-6 px-4 text-center text-xs mt-auto no-print">
                        <div className="max-w-7xl mx-auto space-y-2">
                            <p className="font-semibold text-white">Aplikasi Latihan AKGTK 2026 — Rumpun Pengawas Madrasah</p>
                            <p className="text-emerald-400">
                                Disusun berdasarkan pola kisi-kisi Asesmen Kompetensi Guru dan Tenaga Kependidikan Kementerian Agama RI.
                            </p>
                            <div className="flex items-center justify-center space-x-4 pt-2 text-emerald-400">
                                <span><i className="fa-brands fa-github mr-1"></i>Dikembangkan oleh : Dedi Efendi</span>
                                <span>•</span>
                                <span><i className="fa-solid fa-bolt mr-1"></i>Pengawas Madrasah Kab. Agam</span>
                            </div>
                        </div>
                    </footer>
                </div>
            );
        }

        // Render React DOM App
        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
